[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-dino"
version = "2.0.0"
description = "Console: play Chrome's dino game (a line-for-line port of the Chromium source) inside your terminal, and from Hermes Agent with /console."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Takumi" }]
keywords = ["console", "dino", "hermes", "tui", "chrome-dino", "sixel"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow"]

[project.scripts]
console = "console.cli:main"

[project.urls]
Homepage = "https://github.com/Takumixbt/Console"

[tool.setuptools.packages.find]
include = ["console", "console.*"]

[tool.setuptools.package-data]
"console.games.dino" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
