[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-chess"
version = "2.1.0"
description = "Play chess in your terminal against Claude Code, Codex, OpenCode, Hermes, Stockfish or a built-in engine. Chrome's dino is included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Takumi" }]
keywords = ["chess", "terminal", "tui", "sixel", "claude-code", "codex", "opencode", "hermes", "stockfish", "chrome-dino"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow"]

[project.scripts]
console = "console.cli:main"

[project.urls]
Homepage = "https://github.com/Takumixbt/Console"

[tool.setuptools.packages.find]
include = ["console", "console.*"]

[tool.setuptools.package-data]
"console.games.dino" = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
