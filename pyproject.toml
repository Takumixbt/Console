[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "console-dino"
version = "1.0.0"
description = "Console: a small multi-game terminal you open while Hermes is running. First game: Chrome dino."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Takumi" }]
keywords = ["console", "dino", "hermes", "tui", "chrome-dino"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
console = "console.cli:main"
console-dino = "console.games.dino.cli:main"

[project.urls]
Homepage = "https://github.com/Takumixbt/Console"

[tool.setuptools.packages.find]
include = ["console", "console.*", "console_dino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
