# Console: Hermes plugin manifest
# Product name: Console (capital C); plugin key / enable slug: console (lowercase)
name: console
version: 2.1.0
description: "Console: play chess inside your terminal against the model Hermes is running, the computer, or an installed agent CLI. Chrome's dino is included. /console, or Ctrl+O any time."
author: Takumi
kind: standalone
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - post_llm_call
  - on_session_end
  - on_session_reset
