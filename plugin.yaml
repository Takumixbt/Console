# Console: Hermes plugin manifest
# Product name: Console (capital C); plugin key / enable slug: console (lowercase)
name: console
version: 2.0.0
description: "Console: play Chrome's dino game inside your terminal while Hermes works. /console, or Ctrl+O any time."
author: Takumi
kind: standalone
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - post_llm_call
  - on_session_end
  - on_session_reset
