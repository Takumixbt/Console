# Re-records docs/console-dino.gif from the real engine (Pillow). Manual only.
# Local: python scripts/record_dino_gif.py
name: Record dino GIF
on:
  workflow_dispatch:
jobs:
  gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python scripts/record_dino_gif.py
      - name: Commit the GIF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/console-dino.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged"
          else
            git commit -m "Re-record the dino GIF"
            git push
          fi
