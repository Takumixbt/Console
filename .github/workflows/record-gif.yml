# Writes docs/console-dino.gif from the real dino engine (Pillow).
# Local: python3 scripts/record_dino_gif.py
name: Record dino GIF
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/record_dino_gif.py"
      - "console/**"
      - ".github/workflows/record-gif.yml"
jobs:
  gif:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Record GIF
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -eux
          python3 -m pip install --upgrade pip pillow
          python3 -c "import console; from console.games.dino.game import DinoGame; print('ok', console.__version__)"
          python3 scripts/record_dino_gif.py
          python3 -c "from pathlib import Path; b=Path('docs/console-dino.gif').read_bytes(); assert b[:6] in (b'GIF87a', b'GIF89a'), b[:16]; print(len(b))"
      - name: Commit GIF if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/console-dino.gif
          if git diff --cached --quiet; then
            echo "GIF unchanged"
          else
            git commit -m "Add recorded Console dino GIF"
            git push
          fi
